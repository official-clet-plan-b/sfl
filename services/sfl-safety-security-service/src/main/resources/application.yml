spring:
  application:
    name: sfl-safety-security-service
  datasource:
    url: ${SFL_SAFETY_SECURITY_DB_URL:${SFL_DB_URL:jdbc:postgresql://localhost:5442/sfl_safety_security_service}}
    username: ${SFL_SAFETY_SECURITY_DB_USERNAME:${SFL_DB_USERNAME:sfl}}
    password: ${SFL_SAFETY_SECURITY_DB_PASSWORD:${SFL_DB_PASSWORD:sfl}}
    hikari:
      pool-name: sfl-safety-security-hikari
      # Explicit rather than left to Spring Boot's own default (which is this same number,
      # unstated) - every other setting here is sized relative to it. Every request handler, the
      # RabbitMQ listener, and every one of this service's @Scheduled jobs share this one pool; raise
      # it only with matching headroom on the database's own max_connections, not in isolation.
      maximum-pool-size: ${SFL_DB_POOL_MAX_SIZE:10}
      connection-timeout: ${SFL_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      # HikariCP's own documented starting point for surfacing a checked-out-and-never-returned
      # connection; 0 (the library default) means a leak is invisible until the pool is exhausted.
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # The SSEMP deployable owns two schemas, and Hibernate can only have one default. It is
        # `safety_security`, because that is where the JPA-mapped physical-security and HSE systems
        # will land. S174 is unaffected: its persistence is plain JDBC with every statement
        # schema-qualified (`emergency_notification.activations`, and so on), so it neither reads
        # nor needs this setting. Anything mapped into `emergency_notification` later must therefore
        # carry an explicit @Table(schema = "emergency_notification") - the way AVAMP's entities do
        # in the fleet service - rather than relying on the default and silently resolving here.
        default_schema: safety_security
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # History lives in `safety_security`; both schemas are declared so Flyway creates and manages
    # each one. The two migration series are interleaved in a single version sequence - V1 is the
    # SSEMP foundation, V2-V9 are S174's, renumbered when the emergency deployable was folded in.
    default-schema: safety_security
    schemas: safety_security,emergency_notification
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080}
  rabbitmq:
    # Only used when `sfl.emergency.messaging.transport=rabbitmq`. Boot creates the connection factory
    # from these regardless, but nothing opens a connection until a publisher asks for one - which is
    # why a default `local` deployment needs no broker running. Same broker, same env vars as
    # facilities/fleet - this is the shared `sfl.events` exchange, not a separate instance.
    host: ${SFL_RABBITMQ_HOST:localhost}
    port: ${SFL_RABBITMQ_PORT:5672}
    username: ${SFL_RABBITMQ_USERNAME:sfl}
    password: ${SFL_RABBITMQ_PASSWORD:change-me}
    # Correlated confirms and mandatory returns - required for the drainer to know a publish actually
    # reached the broker rather than just the local socket buffer. See AmqpEmergencyEventTransport.
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SFL_PORT:8092}
  shutdown: graceful
  tomcat:
    threads:
      # Boot's own default is 200 - far more concurrent requests than a 10-connection Hikari pool
      # (above) could ever serve at once. Bounded to a small multiple of the pool size instead, so a
      # burst past capacity queues predictably at the web tier rather than accepting far more requests
      # than the database side can ever drain. Tune both together, not independently.
      max: ${SFL_WEB_MAX_THREADS:20}
      min-spare: ${SFL_WEB_MIN_SPARE_THREADS:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Off by default: Spring Boot registers a RabbitHealthIndicator from AMQP-on-the-classpath alone,
    # and a failing indicator drags the aggregate health status to DOWN - a service that started
    # cleanly and is serving its API correctly would report 503, which a readiness probe reads as
    # "take it out of rotation". Facilities hit exactly this the first time all services started
    # together with AMQP on the classpath; this service now carries the same dependency and needs the
    # same override. Set true deliberately in any environment actually running transport=rabbitmq.
    rabbit:
      enabled: ${SFL_RABBITMQ_HEALTH_ENABLED:false}

sfl:
  security:
    # Secure unless deliberately opened, matching the other two platforms. This key was absent
    # entirely, and so was any filter chain to read it - which did not leave the service open, it
    # left Spring Security's default securing everything including /actuator/health, so the service
    # answered 401 to its own probe. See SafetySecurityConfiguration.
    enabled: ${SFL_SECURITY_ENABLED:true}
    jwks:
      # Bounds how long a request thread can block fetching/validating against the identity
      # provider's JWKS - see SafetySecurityConfiguration.jwtDecoder and TimeoutBoundedJwtDecoders.
      connect-timeout: ${SFL_JWKS_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${SFL_JWKS_READ_TIMEOUT:PT3S}
  service-boundary:
    schema: safety_security,emergency_notification
    owns: "Safety, Security & Emergency Management Platform (SFL.SSEMP) - S160, S160a, S161, S162, S162a, S163, S174 and Phase 2 S165"
  safety-security:
    # true opens Swagger / the operations dashboard in a browser once the service is ready. The run
    # configuration sets these; they stay false for servers, CI, and for a config that is only one
    # member of the "SFL all services" compound and should not also open its own dashboard tab.
    open-swagger: ${SFL_SAFETY_SECURITY_OPEN_SWAGGER:false}
    open-dashboard: ${SFL_SAFETY_SECURITY_OPEN_DASHBOARD:false}
    # The safety_security outbox (every SSEMP module except S174, which has its own) - ADR 0010.
    # Defaults to S174's transport so the one variable that already points SSEMP at the broker points
    # both drainers there; set SFL_SAFETY_SECURITY_EVENT_TRANSPORT only to split them deliberately.
    # `rabbitmq` also declares the inbound queue (sfl.ssemp.inbound, bound to ifimp.#) and starts the
    # listener; `local` records delivery without a broker and consumes nothing.
    messaging:
      transport: ${SFL_SAFETY_SECURITY_EVENT_TRANSPORT:${SFL_EMERGENCY_EVENT_TRANSPORT:local}}
      exchange: ${SFL_SAFETY_SECURITY_EVENT_EXCHANGE:sfl.events}
      confirm-timeout: PT5S
      max-attempts: ${SFL_SAFETY_SECURITY_OUTBOX_MAX_ATTEMPTS:5}
      drainer-enabled: ${SFL_SAFETY_SECURITY_OUTBOX_DRAINER:true}
  risk-assessment:
    # S165 review reminders, recorded lapses and expired review-flag deferrals. Hourly is ample: a lapse
    # takes effect at the review date whatever the sweep does (the currency rule reads the date); the
    # sweep only announces it, and sends the reminder ahead of it.
    scheduling:
      enabled: ${SFL_RISK_ASSESSMENT_SCHEDULER:true}
      fixed-delay: ${SFL_RISK_ASSESSMENT_SCHEDULER_DELAY:PT1H}
      initial-delay: ${SFL_RISK_ASSESSMENT_SCHEDULER_INITIAL_DELAY:PT1M}
  emergency:
    # Outbound delivery uses a self-contained transactional outbox; failed deliveries dead-letter and
    # are replayable. `local` records delivery without a broker and is the single-node default. Any
    # environment with a real consumer must set `rabbitmq` deliberately - selecting it without a
    # RabbitTemplate fails at startup rather than dropping events quietly.
    messaging:
      transport: ${SFL_EMERGENCY_EVENT_TRANSPORT:local}
      exchange: ${SFL_EMERGENCY_EVENT_EXCHANGE:sfl.events}
      # How long the rabbitmq transport waits for the broker's publisher confirm before treating the
      # publish as failed and handing it back to the drainer's retry/dead-letter path.
      confirm-timeout: PT5S
      max-attempts: ${SFL_EMERGENCY_OUTBOX_MAX_ATTEMPTS:5}
    scheduling:
      # Unacknowledged-escalation, dashboard-refresh and stale-integration sweeps. Individual sweeps are
      # also toggled by runtime configuration (emergency.scheduling.*-enabled).
      enabled: ${SFL_EMERGENCY_SCHEDULER:true}
      fixed-delay: ${SFL_EMERGENCY_SCHEDULER_DELAY:PT1M}
      initial-delay: ${SFL_EMERGENCY_SCHEDULER_INITIAL_DELAY:PT30S}
