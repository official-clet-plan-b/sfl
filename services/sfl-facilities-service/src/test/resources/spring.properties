# Spring's test-context cache keeps every distinct @SpringBootTest context alive for the whole run, each
# holding its own Hikari pool (10 connections, application.yml). Past roughly ten distinct contexts that
# exceeds PostgreSQL's default max_connections of 100, and every context created after that point fails
# with "FATAL: sorry, too many clients already" - which is why the Backend workflow had been red since the
# Phase 2 IFIMP merge, with errors that read like defects in whichever suites happened to load last.
#
# Capping the cache evicts (and closes) the least recently used context instead. Six contexts at ten
# connections stays well inside the limit, with headroom for the suites that open their own sfl_app
# connections. The cost is re-creating an evicted context if a later class needs it again.
spring.test.context.cache.maxSize=6
