spring:
  application:
    name: sfl-facilities-service
  datasource:
    url: ${SFL_FACILITIES_DB_URL:${SFL_DB_URL:jdbc:postgresql://localhost:5441/sfl_facilities_service}}
    # `sfl`/`sfl` is the local-dev-only fallback below every env var here; every real deployment
    # overrides both.
    username: ${SFL_FACILITIES_DB_USERNAME:${SFL_DB_USERNAME:sfl}}
    password: ${SFL_FACILITIES_DB_PASSWORD:${SFL_DB_PASSWORD:sfl}}
    hikari:
      pool-name: sfl-facilities-hikari
      # Explicit rather than left to Spring Boot's own default (which is this same number,
      # unstated) - every other setting here is sized relative to it, and an operator changing it
      # should not have to first discover what it already was. Every request handler, the RabbitMQ
      # listener, and every one of the five @Scheduled jobs share this one pool; raise it only with
      # matching headroom on the database's own max_connections (shared across all five services'
      # pools plus their own operational connections), not in isolation.
      maximum-pool-size: ${SFL_DB_POOL_MAX_SIZE:10}
      # How long a caller waits for a connection to free up before failing with a clear pool-exhaustion
      # error, rather than queuing silently. HikariCP's own default, stated rather than assumed.
      connection-timeout: ${SFL_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Flags a connection checked out and never returned - a leak, not a slow query - after this long.
      # HikariCP's own documented starting point; 0 (the library default) means leaks are invisible
      # until the pool is exhausted.
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: facilities
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: facilities
    schemas: facilities
    locations: classpath:db/migration
  rabbitmq:
    # Only used when `sfl.facilities.messaging.transport=rabbitmq`. Boot creates the connection
    # factory from these regardless, but nothing opens a connection until a publisher or a listener
    # asks for one - which is why a default `local` deployment needs no broker running.
    host: ${SFL_RABBITMQ_HOST:localhost}
    port: ${SFL_RABBITMQ_PORT:5672}
    # `sfl`/`change-me` is the local-dev-only fallback below every env var here; every real deployment
    # overrides both.
    username: ${SFL_RABBITMQ_USERNAME:sfl}
    password: ${SFL_RABBITMQ_PASSWORD:change-me}
    # Correlated confirms and mandatory returns, both required for the drainer to know a publish
    # actually reached the broker rather than just the local socket buffer - see
    # AmqpFacilitiesEventTransport, which waits on the per-message CorrelationData future.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # Concurrency stays at one: the ordering that matters here is per vehicle, and one consumer is
        # the simplest way to keep it. Two would be faster and would let a DUE and an OVERDUE for the
        # same vehicle land out of order.
        concurrency: 1
        max-concurrency: 1
        # Requeue on rejection, paired deliberately with how the handler fails.
        #
        # The handler throws only for the unexpected - a database blip, a lock timeout - where
        # retrying is exactly right, and its transaction takes the inbox claim back with it so the
        # redelivery is processed rather than skipped. Anything that can never succeed (an unreadable
        # body, a payload missing the fields the fault needs) is logged and *returned* instead, which
        # leaves the claim committed and acknowledges the message, so it cannot loop.
        #
        # The residual risk is honest: a genuine bug in the handler would requeue forever and fill the
        # log. That is the trade for not losing a transient failure, and it is the right way round for
        # a development broker with no dead-letter exchange behind it. A real deployment on S217 gets
        # a DLQ and this becomes `false`.
        default-requeue-rejected: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080}

server:
  port: ${SFL_PORT:8091}
  shutdown: graceful
  tomcat:
    threads:
      # Boot's own default is 200 - far more concurrent requests than a 10-connection Hikari pool
      # (above) could ever serve at once. Bounded to a small multiple of the pool size instead, so a
      # burst past capacity queues predictably at the web tier and fails fast with a clear timeout,
      # rather than accepting far more requests than the database side can ever drain. Tune both
      # together, not independently.
      max: ${SFL_WEB_MAX_THREADS:20}
      min-spare: ${SFL_WEB_MIN_SPARE_THREADS:4}

management:
  health:
    # Off unless a broker is deliberately in play, matching `sfl-fleet-logistics-service`.
    #
    # This service carries `spring-boot-starter-amqp` and defaults its event transport to `local`, so
    # it does not talk to RabbitMQ at all in a default deployment - but Boot registers the Rabbit
    # health indicator on classpath presence alone, and a failing indicator drags the **aggregate**
    # status to DOWN. The result: a service that had started cleanly, applied its migrations and was
    # serving its API correctly reported `503 DOWN`, which a Kubernetes readiness probe or a load
    # balancer reads as "take it out of rotation".
    #
    # Fleet already had this line. Facilities was the only module with AMQP on the classpath and
    # without it, which is why this surfaced the first time all five services were started together.
    rabbit:
      enabled: ${SFL_RABBITMQ_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sfl:
  service-boundary:
    schema: facilities
    owns: "Facilities service for S152, S153, S159 and Phase 2 S156, S157, S158, S169, S173, S176"
  security:
    roles-claim: ${SFL_SECURITY_ROLES_CLAIM:realm_access.roles}
    # Secure unless deliberately opened. This defaulted to `false`, and the filter chain that opened
    # everything also carried `matchIfMissing = true` - so an environment that simply forgot the
    # variable ran with every endpoint unauthenticated and the actor taken from whatever the caller
    # put in an X-SFL-* header. Both halves are inverted: absent now means secure, and running open
    # takes an explicit SFL_SECURITY_ENABLED=false plus a warning on every startup.
    enabled: ${SFL_SECURITY_ENABLED:true}
    jwks:
      # Bounds how long a request thread can block fetching/validating against the identity
      # provider's JWKS - see FacilitiesSecurityConfiguration.jwtDecoder and TimeoutBoundedJwtDecoders.
      connect-timeout: ${SFL_JWKS_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${SFL_JWKS_READ_TIMEOUT:PT3S}
  facilities:
    # true opens Swagger / the operations dashboard in a browser once the service is ready. The run
    # configuration sets these; they stay false for servers, CI, and for a config that is only one
    # member of the "SFL all services" compound and should not also open its own dashboard tab.
    open-swagger: ${SFL_FACILITIES_OPEN_SWAGGER:false}
    open-dashboard: ${SFL_FACILITIES_OPEN_DASHBOARD:false}
    messaging:
      # `local` records delivery without a broker and is the single-node default. Any environment with a
      # consumer must set `rabbitmq` deliberately - selecting it without a RabbitTemplate fails at
      # startup rather than dropping events quietly, which is the failure this drainer exists to end.
      transport: ${SFL_FACILITIES_EVENT_TRANSPORT:local}
      exchange: ${SFL_FACILITIES_EVENT_EXCHANGE:sfl.events}
      # How long the rabbitmq transport waits for the broker's publisher confirm before treating the
      # publish as failed and handing it back to the drainer's retry/backoff.
      confirm-timeout: PT5S
      drainer-enabled: ${SFL_FACILITIES_DRAINER_ENABLED:true}
      drain-delay: PT10S
      drain-initial-delay: PT15S
      batch-size: 100
      max-attempts: 5
      # Exponential from the base, capped: a broker outage must not turn into a second incident caused
      # by retrying through it, and must not schedule the next attempt beyond the end of the week.
      retry-base: PT10S
      retry-cap: PT1H
    # ---- Phase 2 vendor integration (SRS 2026/002 NFR-SEC2, CORR-07) ------------------------------
    #
    # The one authenticated inbox every inbound vendor message passes through - see
    # VendorMessageVerifier. Each source is allowlisted for exactly one channel and a set of sites, with
    # its own HMAC secret. The three shipped sources are SIMULATORS with the development secret; the
    # service warns on startup about every source still carrying it. A real deployment overrides each
    # secret from the platform secret store and registers real sources per site.
    vendor-inbox:
      signature-window: ${SFL_VENDOR_SIGNATURE_WINDOW:PT5M}
      sources:
        BMS-SIM:
          channel: BMS_TELEMETRY
          secret: ${SFL_VENDOR_BMS_SIM_SECRET:dev-only-not-a-real-secret}
          sites: ["*"]
        AMI-SIM:
          channel: ENERGY_METERING
          secret: ${SFL_VENDOR_AMI_SIM_SECRET:dev-only-not-a-real-secret}
          sites: ["*"]
        CCP-EVENTS-SIM:
          channel: CCP_EVENTS
          secret: ${SFL_VENDOR_CCP_EVENTS_SIM_SECRET:dev-only-not-a-real-secret}
          sites: ["*"]
    # Procurement-gate evidence per vendor integration. Blank = none on file, which is the truth for
    # every entry today: GET /api/v1/facilities/vendor-integrations reports SIMULATED_ADAPTER_ONLY until
    # an SRS §5.2 evidence reference is entered here. There is no "integrated" status to set.
    vendor-integrations:
      bms-iot:
        system: S156
        name: Building Management System / IoT platform
        classification: Buy and Integrate
        adapter: SimulatedBmsTelemetryAdapter
        procurement-gate-evidence: ${SFL_S156_PROCUREMENT_GATE_EVIDENCE:}
      energy-metering:
        system: S157
        name: Utility metering / AMI gateway
        classification: Hybrid
        adapter: SimulatedMeteringAdapter
        procurement-gate-evidence: ${SFL_S157_PROCUREMENT_GATE_EVIDENCE:}
    booking:
      # Bounds how long a booking request can queue behind another one holding the same room/resource
      # advisory lock before giving up with a 409 rather than holding its connection (and the pool slot
      # behind it) indefinitely. See JpaBookingRepositoryAdapter.acquireAdvisoryLock.
      advisory-lock-timeout: ${SFL_BOOKING_ADVISORY_LOCK_TIMEOUT:PT5S}
    audit:
      chain-verification:
        # Bounds how much of the audit chain one verifyChain() call replays: at most batch-size rows
        # per page, at most max-batches-per-call pages - 1,000,000 rows by default. A chain within that
        # bound verifies to completion in one call; a longer one returns an "incomplete" result with a
        # resume cursor rather than materialising the whole table or holding one HTTP request open
        # indefinitely. See JpaAuditAdapter.verifyChain.
        batch-size: ${SFL_AUDIT_VERIFICATION_BATCH_SIZE:5000}
        max-batches-per-call: ${SFL_AUDIT_VERIFICATION_MAX_BATCHES:200}
