<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SFL Operations dashboards - Safety, Facilities and Logistics" />
    <meta name="color-scheme" content="light" />
    <title>SFL Operations</title>

    <!--
      The CLET design system specifies Roboto Serif for titles and Lato for body text. The
      stylesheet is loaded asynchronously (media="print", switched on load) so that a directorate
      network which cannot reach the font host costs the dashboard a typeface rather than a blank
      screen - a render-blocking <link> to an unreachable origin does exactly that. Both families
      have system fallbacks declared in the theme.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Serif:opsz,wght@8..144,400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Serif:opsz,wght@8..144,400..700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Shown until React's first paint replaces it: the app asks the services for its platform,
         permissions and feature flags before rendering, which can take a moment. -->
    <style>
      .sfl-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; background: #f9fafb; font-family: Lato, system-ui, sans-serif;
        color: #475467; font-size: 14px; }
      .sfl-boot__ring { width: 40px; height: 40px; border-radius: 50%; border: 3.5px solid rgba(12, 74, 110, 0.15);
        border-top-color: #0c4a6e; animation: sfl-boot-spin 0.8s linear infinite; }
      @keyframes sfl-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .sfl-boot__ring { animation-duration: 2.4s; } }
    </style>
    <div id="root"><div class="sfl-boot" role="status" aria-live="polite"><span class="sfl-boot__ring"></span><span>Loading SFL Operations…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
