
name: Security


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No `cache: pip` — there is nothing to restore against at this point.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"


      - name: Install Semgrep
        run: |
          pip install --only-binary :all: semgrep==1.172.0
      - name: Run Semgrep Scan
        run: |
          mkdir -p reports
          semgrep scan --config p/owasp-top-ten --config p/security-audit \
            --error --metrics=off \
            --json-output=reports/semgrep.json --sarif-output=reports/semgrep.sarif
      - name: Upload Semgrep SARIF to code scanning
        if: ${{ always() && hashFiles('reports/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: reports/semgrep.*
          if-no-files-found: warn
          retention-days: 90

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `misconfig`, not the deprecated `config` alias (trivy discussions/5586).
      # Suppressions live in .trivyignore, each with a reason and a re-check condition.
      #
      # Three passes: the gate first, then the two report formats. The report passes carry
      # `if: always()` and exit-code 0, so the artifacts exist even when the gate above has
      # already failed the job — which is exactly the run someone wants the report from. The
      # DB is cached from the gating pass, so the extra passes cost seconds, not a re-download.
      #
      # `mkdir` first: trivy-action opens `output:` directly and will not create reports/.
      - name: Create the reports directory
        run: mkdir -p reports

      - name: Run Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Safe to retain and pass around: Trivy REDACTS matched secrets in its output — the
      # Match field comes back as asterisks with the key material absent.
      - name: Write Trivy report (JSON)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          ignore-unfixed: true
          format: 'json'
          output: 'reports/trivy.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Write Trivy report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          ignore-unfixed: true
          format: 'sarif'
          output: 'reports/trivy.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report
          path: reports/trivy.*
          if-no-files-found: warn
          retention-days: 90

  bandit:
    name: Bandit SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pinned and wheel-only, for the reasons on the semgrep install above. Unlike semgrep,
      # bandit's checks ship inside the package, so this pin genuinely holds the rule set
      # steady until it is bumped.
      #
      # bandit-sarif-formatter is a plugin: bandit's built-in -f list is
      # csv/custom/html/json/screen/txt/xml/yaml, with no SARIF. Installing it adds `sarif`.
      - name: Install Bandit
        run: |
          pip install --only-binary :all: bandit==1.9.4 bandit-sarif-formatter==1.1.1
      # Moved here from ci.yml, where it ran as `bandit -r app/ -ll --exclude app/tests/
      # || true` and so could never fail a build or tell anyone anything. It was reporting a
      # HIGH — httpx with certificate checking disabled — into a step nobody reads.
      #
      # Two changes beyond removing the `|| true`:
      #   scripts/ is now in scope. It was not before, so the B310 in register_schemas.py had
      #   never been looked at by anything.
      #   `--exclude app/tests/` is dropped because that directory does not exist — the tests
      #   live in tests/ at the repo root, which -r app/ scripts/ does not reach anyway.
      #
      # Bandit writes one format per invocation, so the reports are written first with
      # `|| true` — they are evidence, not a gate — and the bare third run is what decides the
      # job. Three passes over ~11k lines costs a couple of seconds.
      - name: Run Bandit
        run: |
          mkdir -p reports
          bandit -r app/ scripts/ -ll -f json  -o reports/bandit.json  || true
          bandit -r app/ scripts/ -ll -f sarif -o reports/bandit.sarif || true
          bandit -r app/ scripts/ -ll
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: reports/bandit.*
          if-no-files-found: warn
          retention-days: 90

  # ── Inventory ────────────────────────────────────────────────────────────────────────
  # Advisory by nature: an SBOM records what is there, it does not pass or fail.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Syft catalogues every ecosystem in one pass. On this repository that is pypi plus
      # github-actions — and the actions are the interesting half: they are now pinned to
      # commit SHAs, and this is the only place that inventory is written down.
      #
      # Both formats on purpose. CycloneDX is what most vulnerability tooling ingests; SPDX
      # is what procurement and compliance reviews tend to ask for by name.
      #
      # ⚠ READ THIS BEFORE TRUSTING THE PYPI HALF. Measured locally: 21 components — 13
      # github-actions but only FOUR pypi. Those four are exactly the four lines in
      # requirements.txt carrying an `==`. The other nine (fastapi, uvicorn, pydantic,
      # pydantic-settings, redis, confluent-kafka, httpx, pyyaml, prometheus-client) are
      # ABSENT, because syft cannot record a version nobody wrote down — and no transitive
      # dependency appears at all.
      #
      # So this file is an honest inventory of the pinned surface and a misleading one of the
      # whole application: read for compliance, it says a FastAPI service ships four Python
      # packages. It is the same root cause as Trivy's blind spot in the job above, and it has
      # the same single fix — pin requirements.txt. Until then, treat the pypi section as a
      # floor, not a manifest.
      #
      # Same reason as the trivy job: the action opens output-file directly and will not
      # create reports/ for us.
      - name: Create the reports directory
        run: mkdir -p reports

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: reports/sbom.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: reports/sbom.spdx.json
          upload-artifact: false

      # Kept a year rather than 90 days: an SBOM's value is answering "were we shipping the
      # affected version last March" when an advisory lands months later, and a 90-day window
      # cannot answer that. NOTE: GitHub clamps this to the org's maximum retention — on
      # iam-3.0 the same 365 came back as 90, so raising the org cap is what actually buys
      # the year.
      #
      # if-no-files-found: error, not warn. An SBOM job that silently uploads nothing is
      # worse than no SBOM job, because the green tick says the inventory exists.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: reports/sbom.*
          if-no-files-found: error
          retention-days: 365
