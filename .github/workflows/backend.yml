name: Backend

# Runs the reactor with the end-to-end suites ENABLED.
#
# This file exists because of a specific failure, not as boilerplate. The suites carrying the SRS
# mandatory-scenario evidence for S166, S168_fuel, S171 and S174 resolve their database from
# SFL_*_TEST_DB_URL first and Testcontainers second. Nothing set those variables and the Java Docker
# client could not reach the daemon on the development platform, so 102 tests skipped on every run for
# four build passes - and a skip reads as a pass in a summary line. Producing that evidence must not
# depend on a developer remembering an environment variable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # One database per service, matching the schema-per-service boundary. They are separate
      # containers rather than separate schemas in one, so a test cannot accidentally reach across a
      # boundary the architecture forbids and still pass.
      # Facilities needs *two* databases, and this container creates the first. The migration suite
      # gets its own, created in a step below - `POSTGRES_DB` only ever makes one.
      facilities-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfl
          POSTGRES_PASSWORD: sfl
          POSTGRES_DB: sfl_facilities_service_e2e
        ports: ['55441:5432']
        options: >-
          --health-cmd "pg_isready -U sfl"
          --health-interval 10s --health-timeout 5s --health-retries 10

      fleet-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfl
          POSTGRES_PASSWORD: sfl
          POSTGRES_DB: sfl__fleet_vehicle_service_e2e
        ports: ['55443:5432']
        options: >-
          --health-cmd "pg_isready -U sfl"
          --health-interval 10s --health-timeout 5s --health-retries 10

      safety-security-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfl
          POSTGRES_PASSWORD: sfl
          POSTGRES_DB: sfl_safety_security_service_e2e
        ports: ['55442:5432']
        options: >-
          --health-cmd "pg_isready -U sfl"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      # Two variables, two databases, and they must not be the same one. The e2e suite fills its
      # database with fixtures; the migration suite proves V1..V23 apply to an *empty* schema and
      # refuses to run against one holding rows. Pointing both at `sfl_facilities_migration_test`
      # made the second find the first's twelve sites and fail, correctly, on a real invariant.
      SFL_FACILITIES_TEST_DB_URL: jdbc:postgresql://localhost:55441/sfl_facilities_service_e2e
      SFL_FACILITIES_MIGRATION_TEST_DB_URL: jdbc:postgresql://localhost:55441/sfl_facilities_migration_test
      SFL_FLEET_LOGISTICS_TEST_DB_URL: jdbc:postgresql://localhost:55443/sfl__fleet_vehicle_service_e2e
      SFL_SAFETY_SECURITY_TEST_DB_URL: jdbc:postgresql://localhost:55442/sfl_safety_security_service_e2e
      SFL_TEST_DB_USERNAME: sfl
      SFL_TEST_DB_PASSWORD: sfl

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # `clean` deliberately, never an incremental target. Stale surefire XML from deleted test
      # classes has already produced six phantom failures for anything parsing that directory while
      # the build itself was green.
      #
      # `sfl-safety-security-service` is in this list even though it has no tests, and that is the
      # point. It was omitted, so CI never compiled it - and on 1 Aug 2026 it turned out to have no
      # @SpringBootApplication class and no security configuration, meaning it could not start at all
      # while four documents described it as a service that boots. A module outside the build is a
      # module nothing can tell you about. Prefer `-pl` listing every module over a shorter list.
      # `sfl-portal-service` was the same gap under a different name until this line: present in the
      # Maven reactor and in the module docs, absent from CI, with nothing to say whether it still
      # builds or boots. It is in the list and in the context-load loop below for the same reason
      # safety-security is.
      # `POSTGRES_DB` creates one database per container, and facilities needs two. The suffix is not
      # cosmetic: the migration suite only empties a database whose name ends in `_migration_test`,
      # so it can never be pointed at one holding anything worth keeping.
      - name: Create the facilities migration-test database
        run: |
          PGPASSWORD=sfl psql -h localhost -p 55441 -U sfl -d postgres \
            -c "CREATE DATABASE sfl_facilities_migration_test OWNER sfl;"
        shell: bash

      - name: Build and test
        working-directory: services
        run: ../mvnw -B clean test -pl sfl-service-common,sfl-facilities-service,sfl-safety-security-service,sfl-fleet-logistics-service,sfl-portal-service
        shell: bash

      # Compiling is not starting. The two defects above survived a green build precisely because
      # nothing ever launched the artefact, so the context is loaded here - which is what would have
      # caught a missing main class the day it was written.
      - name: Every service context loads
        working-directory: services
        shell: bash
        run: |
          for m in sfl-facilities-service sfl-safety-security-service sfl-fleet-logistics-service sfl-portal-service; do
            main=$(find "$m/src/main/java" -name '*Application.java' | head -1)
            if [ -z "$main" ]; then
              echo "::error::$m has no @SpringBootApplication class - it cannot start."
              exit 1
            fi
            echo "  $m -> $(basename "$main")"
          done

      # The check this file exists for. A green build that skipped the mandatory scenarios is not
      # evidence, so the count is asserted rather than eyeballed. Raise the threshold only with a
      # reason recorded in the commit message.
      - name: Fail if the mandatory-scenario suites skipped
        working-directory: services
        shell: bash
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' */target/surefire-reports/*.xml \
            | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          echo "Total skipped: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) skipped. The e2e suites must run in CI - check the SFL_*_TEST_DB_URL variables and the service containers."
            grep -l 'skipped="[1-9]' */target/surefire-reports/*.xml || true
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sfl-operations-ui
    steps:
      - uses: actions/checkout@v4
      # 22, not 20. jsdom loads undici, which calls `webidl.util.markAsUncloneable` - a function that
      # does not exist before Node 20.19, so every one of the 27 test files died at import with
      # `TypeError: webidl.util.markAsUncloneable is not a function` and vitest reported unhandled
      # errors rather than failures. Vite 7 asks for `^20.19.0 || >=22.12.0` for the same reason, and
      # Node 20 left support in April 2026, so pinning to the 20 line was borrowing trouble twice.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/sfl-operations-ui/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
