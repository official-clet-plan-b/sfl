services:
  postgres:
    # Pinned to 16, matching CI (.github/workflows/backend.yml) and the deploy-representative
    # docker-compose.microservices.yml. A dev stack on a different major version than CI risks
    # version-specific SQL/behavior drift going undetected until it reaches CI or production.
    image: postgres:16-alpine
    container_name: sfl-dev-postgres
    environment:
      POSTGRES_USER: ${SFL_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_POSTGRES_DB:-sfl}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sfl_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sfl-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${SFL_RABBITMQ_USER:-sfl}
      RABBITMQ_DEFAULT_PASS: ${SFL_RABBITMQ_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - sfl_rabbitmq_data:/var/lib/rabbitmq

  idp-postgres:
    # Zitadel requires Postgres (or CockroachDB) as its backing store - there is no embedded/in-memory
    # mode the way Keycloak's start-dev has one. A dedicated instance, not a database inside the
    # `postgres` service above, matching how docker-compose.microservices.yml gives every service its
    # own Postgres rather than sharing one.
    image: postgres:16-alpine
    container_name: sfl-dev-idp-postgres
    environment:
      POSTGRES_USER: ${SFL_IDP_POSTGRES_USER:-zitadel}
      POSTGRES_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_IDP_POSTGRES_DB:-zitadel}
    volumes:
      - sfl_idp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_IDP_POSTGRES_USER:-zitadel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  idp:
    # The platform's OIDC provider. Verified directly (not assumed) against v4.17.3 before this was
    # written: start-from-init against this Postgres brings up a working instance whose
    # /.well-known/openid-configuration issuer is the bare externalDomain:externalPort - no
    # Keycloak-style /realms/<name> path - which is exactly what every service's
    # SFL_IAM_ISSUER default now expects (see each application.yml).
    #
    # Zitadel itself is stateless - every bit of instance state (the setup start-from-init performs
    # included) lives in idp-postgres, not in this container. Deleting sfl_idp_postgres_data is what
    # resets the instance; restarting this container alone does not.
    image: ghcr.io/zitadel/zitadel:latest
    container_name: sfl-dev-idp
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: idp-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${SFL_IDP_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${SFL_IDP_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${SFL_IDP_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_MASTERKEY: ${SFL_IDP_MASTERKEY:-ChangeThisMasterkey32Characters!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${SFL_IDP_ADMIN:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${SFL_IDP_ADMIN_PASSWORD:-Change-Me-1!}
    depends_on:
      idp-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # No shell in this image, so a CMD-SHELL healthcheck can never run - `zitadel ready` is the
      # binary's own equivalent and needs none.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  sfl_postgres_data:
  sfl_rabbitmq_data:
  sfl_idp_postgres_data:
