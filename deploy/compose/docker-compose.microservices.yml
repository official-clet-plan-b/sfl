services:
  facilities-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_FACILITIES_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_FACILITIES_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_FACILITIES_POSTGRES_DB:-sfl_facilities_service}
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - sfl_facilities_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_FACILITIES_POSTGRES_USER:-sfl} -d ${SFL_FACILITIES_POSTGRES_DB:-sfl_facilities_service}"]
      interval: 10s
      timeout: 5s
      retries: 10

  safety-security-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_SAFETY_SECURITY_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_SAFETY_SECURITY_POSTGRES_DB:-sfl_safety_security_service}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - sfl_safety_security_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl} -d ${SFL_SAFETY_SECURITY_POSTGRES_DB:-sfl_safety_security_service}"]
      interval: 10s
      timeout: 5s
      retries: 10

  fleet-vehicle-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_FLEET_LOGISTICS_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_FLEET_LOGISTICS_POSTGRES_DB:-sfl__fleet_vehicle_service}
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - sfl_fleet_vehicle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl} -d ${SFL_FLEET_LOGISTICS_POSTGRES_DB:-sfl__fleet_vehicle_service}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SFL_RABBITMQ_USER:-sfl}
      RABBITMQ_DEFAULT_PASS: ${SFL_RABBITMQ_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  idp-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${SFL_KEYCLOAK_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_KEYCLOAK_POSTGRES_DB:-keycloak}
    volumes:
      - sfl_keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_KEYCLOAK_POSTGRES_USER:-keycloak} -d ${SFL_KEYCLOAK_POSTGRES_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  idp:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--http-port=8080", "--health-enabled=true", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://idp-postgres:5432/${SFL_KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${SFL_KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${SFL_KEYCLOAK_POSTGRES_PASSWORD:-change-me}
      KEYCLOAK_ADMIN: ${SFL_KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${SFL_KEYCLOAK_ADMIN_PASSWORD:-Change-Me-1!}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME: ${SFL_KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    volumes:
      - ../idp:/opt/keycloak/data/import:ro
    depends_on:
      idp-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The official Keycloak image does not ship curl. Bash is present, so probe its management
      # port directly without adding a utility layer to the image.
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Retained for migrations or environments that still use Zitadel. It is not part of the default
  # stack and never receives application traffic unless the zitadel profile is explicitly enabled.
  zitadel-postgres:
    image: postgres:16-alpine
    profiles: ["zitadel"]
    environment:
      POSTGRES_USER: ${SFL_IDP_POSTGRES_USER:-zitadel}
      POSTGRES_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_IDP_POSTGRES_DB:-zitadel}
    volumes:
      - sfl_idp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_IDP_POSTGRES_USER:-zitadel} -d ${SFL_IDP_POSTGRES_DB:-zitadel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    profiles: ["zitadel"]
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${SFL_IDP_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${SFL_IDP_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${SFL_IDP_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${SFL_ZITADEL_EXTERNALDOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${SFL_ZITADEL_EXTERNALPORT:-8081}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_MASTERKEY: ${SFL_IDP_MASTERKEY:-ChangeThisMasterkey32Characters!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${SFL_IDP_ADMIN:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${SFL_IDP_ADMIN_PASSWORD:-Change-Me-1!}
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  sfl-facilities-service:
    build:
      context: ../..
      dockerfile: services/sfl-facilities-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_FACILITIES_DB_URL: jdbc:postgresql://facilities-postgres:5432/sfl_facilities_service
      SFL_FACILITIES_DB_USERNAME: ${SFL_FACILITIES_POSTGRES_USER:-sfl}
      SFL_FACILITIES_DB_PASSWORD: ${SFL_FACILITIES_POSTGRES_PASSWORD:-change-me}
      SFL_IAM_ISSUER: ${SFL_IAM_ISSUER:-http://idp:8080/realms/sfl}
      SFL_SECURITY_ROLES_CLAIM: ${SFL_SECURITY_ROLES_CLAIM:-realm_access.roles}
      SFL_RABBITMQ_HOST: rabbitmq
      SFL_RABBITMQ_USERNAME: ${SFL_RABBITMQ_USER:-sfl}
      SFL_RABBITMQ_PASSWORD: ${SFL_RABBITMQ_PASSWORD:-change-me}
      SFL_FACILITIES_EVENT_TRANSPORT: rabbitmq
      SFL_RABBITMQ_HEALTH_ENABLED: "true"
    ports:
      - "8091:8080"
    depends_on:
      facilities-postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  sfl-safety-security-service:
    build:
      context: ../..
      dockerfile: services/sfl-safety-security-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_SAFETY_SECURITY_DB_URL: jdbc:postgresql://safety-security-postgres:5432/sfl_safety_security_service
      SFL_SAFETY_SECURITY_DB_USERNAME: ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}
      SFL_SAFETY_SECURITY_DB_PASSWORD: ${SFL_SAFETY_SECURITY_POSTGRES_PASSWORD:-change-me}
      SFL_IAM_ISSUER: ${SFL_IAM_ISSUER:-http://idp:8080/realms/sfl}
      SFL_SECURITY_ROLES_CLAIM: ${SFL_SECURITY_ROLES_CLAIM:-realm_access.roles}
      SFL_RABBITMQ_HOST: rabbitmq
      SFL_RABBITMQ_USERNAME: ${SFL_RABBITMQ_USER:-sfl}
      SFL_RABBITMQ_PASSWORD: ${SFL_RABBITMQ_PASSWORD:-change-me}
      SFL_EMERGENCY_EVENT_TRANSPORT: rabbitmq
      SFL_RABBITMQ_HEALTH_ENABLED: "true"
    ports:
      - "8092:8080"
    depends_on:
      safety-security-postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  sfl-fleet-logistics-service:
    build:
      context: ../..
      dockerfile: services/sfl-fleet-logistics-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_FLEET_LOGISTICS_DB_URL: jdbc:postgresql://fleet-vehicle-postgres:5432/sfl__fleet_vehicle_service
      SFL_FLEET_LOGISTICS_DB_USERNAME: ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}
      SFL_FLEET_LOGISTICS_DB_PASSWORD: ${SFL_FLEET_LOGISTICS_POSTGRES_PASSWORD:-change-me}
      SFL_IAM_ISSUER: ${SFL_IAM_ISSUER:-http://idp:8080/realms/sfl}
      SFL_SECURITY_ROLES_CLAIM: ${SFL_SECURITY_ROLES_CLAIM:-realm_access.roles}
      SFL_RABBITMQ_HOST: rabbitmq
      SFL_RABBITMQ_USERNAME: ${SFL_RABBITMQ_USER:-sfl}
      SFL_RABBITMQ_PASSWORD: ${SFL_RABBITMQ_PASSWORD:-change-me}
      SFL_FLEET_EVENT_TRANSPORT: rabbitmq
      SFL_RABBITMQ_HEALTH_ENABLED: "true"
    ports:
      - "8093:8080"
    depends_on:
      fleet-vehicle-postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # The one dashboard bundle for all three platforms (see sfl-portal-service/pom.xml). It was absent
  # from this file entirely - present in the Maven reactor and in the module docs, but with no
  # deployment path in the topology it actually describes.
  sfl-portal-service:
    build:
      context: ../..
      dockerfile: services/sfl-portal-service/Dockerfile
      args:
        VITE_SFL_IAM_ISSUER: ${VITE_SFL_IAM_ISSUER:-http://localhost:8080/realms/sfl}
        VITE_SFL_IAM_CLIENT_ID: ${VITE_SFL_IAM_CLIENT_ID:-sfl-operations-ui}
    environment:
      SFL_PORTAL_PORT: 8080
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  sfl_facilities_postgres_data:
  sfl_safety_security_postgres_data:
  sfl_fleet_vehicle_postgres_data:
  sfl_keycloak_postgres_data:
  sfl_idp_postgres_data:
